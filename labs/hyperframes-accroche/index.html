    <script>

      var SIGNS = {

        down: '<path d="M50 24 V74 M30 56 L50 76 L70 56"/>',

        alert: '<path d="M50 26 V58"/><circle cx="50" cy="74" r="6" fill="#2d3a5a" stroke="none"/>',

        empty: '<ellipse cx="50" cy="52" rx="26" ry="18" stroke-width="7"/><path d="M26 24 L74 80" stroke-width="7"/>',
      };
      function sign(kind, size) {
        return (
          '<div class="sign ' + kind + '" style="width:' + size + "px;height:" + size + 'px"><svg width="' + size * 0.78 + '" height="' + size * 0.78 +
          '" viewBox="0 0 100 100" fill="none" stroke="#2d3a5a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">' + SIGNS[kind] + "</svg></div>"
        );
      }
      function letters(el, text) {
        el.insertAdjacentHTML("beforeend", text.split("").map(function (c) { return '<span class="ch">' + c + "</span>"; }).join(""));
        return el.querySelectorAll(".ch");
      }
      // pictos « ligne » des 5 constantes
      var PICTOS = [
        ["T°", '<path d="M42 62 V20 A8 8 0 0 1 58 20 V62 A16 16 0 1 1 42 62 Z"/><circle cx="50" cy="75" r="6" fill="#2d3a5a" stroke="none"/><path d="M50 70 V42"/>'],

        ["FR", '<path d="M50 14 V44 M50 44 C44 46 42 50 42 56 M50 44 C56 46 58 50 58 56"/><path d="M38 30 C24 30 14 50 14 70 C14 82 22 86 32 84 C40 82 42 76 42 66 V40 C42 34 41 30 38 30 Z"/><path d="M62 30 C76 30 86 50 86 70 C86 82 78 86 68 84 C60 82 58 76 58 66 V40 C58 34 59 30 62 30 Z"/>'],

      PICTOS.forEach(function (p, k) {
        var x = 72 + (936 * (k + 0.5)) / 5 - 62;
        row.insertAdjacentHTML(
          "beforeend",
          '<div class="badge" id="b' + k + '" style="left:' + x + 'px"><div class="disc"><svg width="72" height="72" viewBox="0 0 100 100" fill="none" stroke="#2d3a5a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">' +
            p[1] + '</svg></div><div class="lab">' + p[0] + "</div></div>",
        );
      });
      var MARQUEE = [
        [["Fébrile", "up"], ["Tachycardie", "up"], ["Dyspnée", "alert"], ["Systolique", "squeeze"], ["Hypoxémie", "empty"], ["Apyrétique", "check"], ["Bradypnée", "down"], ["Hypotension", "down"]],
        [["Arythmie", "wave"], ["Désaturation", "down"], ["Hypothermie", "down"], ["Tachypnée", "up"], ["Diastolique", "relax"], ["Bradycardie", "down"], ["Hypertension", "up"], ["Oxymètre de pouls", "device"]],
      ];
      MARQUEE.forEach(function (items, r) {
        document.getElementById("track" + (r + 1)).innerHTML = items.map(function (it) { return '<div class="tchip">' + sign(it[1], 54) + it[0] + "</div>"; }).join("");
      });
      // éclats
      document.querySelectorAll(".burst").forEach(function (svg) {
        var x = +svg.dataset.x, y = +svg.dataset.y, r = +svg.dataset.r, n = 12, html = '<g class="bg">';
        for (var i = 0; i < n; i++) {
          var a = (i / n) * Math.PI * 2 + 0.3;
          html += '<line x1="' + (x + Math.cos(a) * r) + '" y1="' + (y + Math.sin(a) * r) + '" x2="' + (x + Math.cos(a) * (r + 34)) + '" y2="' + (y + Math.sin(a) * (r + 34)) +
            '" stroke="' + (i % 2 ? "#eaa7c1" : "#4e7ac7") + '" stroke-width="9" stroke-linecap="round"/>';
        }
        svg.innerHTML = html + "</g>";
      });
      // mascottes
      function mascot(id, poses) {
        var el = document.getElementById(id);
        el.innerHTML = '<div class="mdisc"></div><div class="win"><div class="flt">' +
          poses.map(function (p, i) { return '<div class="pose" id="' + id + "p" + i + '"><img src="assets/mascotte/' + p[1] + '.webp"/></div>'; }).join("") + "</div></div>";
      }
      var M1 = [[C.les + 0.02, "gestes_bonjour"], [C.surtout - L, "gestes_important"], [C.absolument - L, "situations_a-retenir"]];
      var M2 = [[C.evalue - L, "situations_explique"], [C.febrile - L, "expressions_surprise"]];
      mascot("m1", M1);
      mascot("m2", M2);
      // thermomètre : graduations
      var ticks = "";
      for (var t = 34; t <= 41; t++) {
        var ty = 400 - ((t - 34) / 7) * 366;
        ticks += '<path d="M120 ' + ty + " H" + (t % 2 ? 140 : 132) + '" stroke="rgba(45,58,90,.55)" stroke-width="5" stroke-linecap="round"/>';
        if (t % 2) ticks += '<text x="146" y="' + (ty + 8) + '" fill="rgba(45,58,90,.6)" font-family="Inter" font-weight="700" font-size="22">' + t + "</text>";
      }
      document.getElementById("ticks").innerHTML = ticks;
      // ondes de chaleur
      var heat = "";
      [70, 310, 345].forEach(function (x0, k) {
        var pts = [];
        for (var i = 0; i < 30; i++) { var y = 420 - i * 12; pts.push(x0 + 12 * Math.sin((y + k * 40) / 26) + "," + y); }
        heat += '<polyline points="' + pts.join(" ") + '"/>';
      });
      document.getElementById("heat").innerHTML = heat;
      // surface du liquide rose (vague), large pour pouvoir glisser horizontalement
      var wv = "M-400 0";
      for (var x = -400; x <= 1400; x += 40) wv += " L" + x + " " + (14 * Math.sin(x / 70)).toFixed(1);
      document.getElementById("wave").setAttribute("d", wv + " L1400 700 L-400 700 Z");
      var tLetters = letters(document.getElementById("t2"), "température");
      var laLetters = letters(document.getElementById("t1"), "La");
      var cLetters = letters(document.getElementById("constantes"), "constantes");
      var termLetters = letters(document.getElementById("tterm"), "Fébrile");
      // ─────────────── timeline ───────────────
      var T = C.un - 0.5; // la transition shader se termine quand la voix dit « Un »
      var tl = HyperShader.init({
        bgColor: "#f8f9fc",
        accentColor: "#eaa7c1",
        scenes: ["s1", "s2"],
        transitions: [{ time: T, shader: "ripple-waves", duration: 0.5 }],
      });
      var NO = { immediateRender: false };
      function ext(a, b) { for (var k in b) a[k] = b[k]; return a; }
      function burst(sel, t) {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.1 }, t);
        tl.fromTo(sel + " .bg", { scale: 0.55, svgOrigin: document.querySelector(sel).dataset.x + " " + document.querySelector(sel).dataset.y }, { scale: 1, duration: 0.47, ease: "expo.out" }, t);
        tl.fromTo(sel, { opacity: 1 }, ext({ opacity: 0, duration: 0.4 }, NO), t + 0.2);
      }
      function punch(sel, t, k) {
        k = k || 0.05;
        tl.fromTo(sel, { scale: 1 }, ext({ scale: 1 + k, duration: 0.13, ease: "power2.out" }, NO), t);
        tl.fromTo(sel, { scale: 1 + k }, ext({ scale: 1, duration: 0.6, ease: "power2.out" }, NO), t + 0.13);
      }
      function mascotTimeline(id, poses) {
        tl.fromTo("#" + id + " .mdisc", { scale: 0 }, { scale: 1, duration: 0.5, ease: "back.out(1.8)" }, poses[0][0]);
        poses.forEach(function (p, i) {
          var rise = p[0] + (i === 0 ? 0.13 : 0.1);
          tl.fromTo("#" + id + "p" + i, { y: 440 }, ext({ y: 0, duration: 0.45, ease: "back.out(1.7)" }, i ? NO : {}), rise);
          if (poses[i + 1]) tl.fromTo("#" + id + "p" + i, { y: 0 }, ext({ y: 440, duration: 0.17, ease: "power2.in" }, NO), poses[i + 1][0]);
        });
        tl.fromTo("#" + id + " .flt", { y: -5 }, { y: 5, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 9 }, 0);
      }

      // fonds vivants (les deux scènes)
      tl.fromTo("#dots1, #dots2", { y: 0 }, { y: -276, duration: 15, ease: "none" }, 0);
      tl.fromTo(".deco", { y: -8, rotation: -8 }, { y: 8, rotation: 8, duration: 1.8, ease: "sine.inOut", yoyo: true, repeat: 7, stagger: 0.35 }, 0);

      /* ═══ accroche ═══ */
      tl.fromTo("#five", { scale: 0.75, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.8, ease: "elastic.out(1, 0.5)" }, 0);
      tl.fromTo("#les", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.25 }, C.les - L);
      burst("#burst5", C["5"] - L);
      tl.fromTo("#ring circle", { rotation: 0, svgOrigin: "540 800" }, { rotation: 140, duration: 2.2, ease: "none" }, 0);
      // le 5 file dans le titre quand « constantes » arrive
      var FLY = C.constantes - L - 0.07;
      tl.fromTo("#five", { x: 0, y: 0, scale: 1 }, ext({ x: -378, y: -480, scale: 180 / 460, duration: 0.47, ease: "expo.out" }, NO), FLY);
      tl.fromTo("#ring", { opacity: 1 }, ext({ opacity: 0, duration: 0.3 }, NO), FLY);
      tl.fromTo("#les", { opacity: 1 }, ext({ opacity: 0, y: -20, duration: 0.25 }, NO), FLY);
      tl.fromTo(cLetters, { opacity: 0, y: 36, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2.4)", stagger: 0.03 }, C.constantes + 0.03);
      // « à ne surtout pas oublier » : chaque mot sur la voix
      [["#w-a", C["a"]], ["#w-ne", C.ne], ["#w-surtout", C.surtout], ["#w-pas", C.pas], ["#w-oublier", C.oublier]].forEach(function (w) {
        tl.fromTo(w[0], { opacity: 0, y: 30, rotation: -4 }, { opacity: 1, y: 0, rotation: 0, duration: 0.4, ease: "back.out(2)" }, w[1] - L);
      });
      tl.fromTo("#w-surtout .brush", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "expo.out" }, C.surtout + 0.15);
      tl.fromTo("#w-surtout", { scale: 1 }, ext({ scale: 1.12, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, NO), C.surtout + 0.3);
      tl.fromTo("#line2 .w", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)", stagger: 0.14 }, C.quand - L);
      PICTOS.forEach(function (_, k) {
        tl.fromTo("#b" + k, { opacity: 0, y: 60, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(2.2)" }, C.constantes + 0.33 + k * 0.1);
        tl.fromTo("#b" + k + " .disc", { rotation: -6 }, { rotation: 6, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 4 }, C.constantes + 0.8 + k * 0.2);
      });
      // bandeaux de termes qui défilent
      var RUN = 7.6 - C.avec;
      tl.fromTo("#row1", { opacity: 0, x: 300 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, C.avec - L);
      tl.fromTo("#row2", { opacity: 0, x: -300 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, C.avec - L + 0.13);
      tl.fromTo("#track1", { x: 40 }, { x: 40 - 180 * RUN, duration: RUN, ease: "none" }, C.avec - L);
      tl.fromTo("#track2", { x: -1700 }, { x: -1700 + 180 * RUN, duration: RUN, ease: "none" }, C.avec - L);
      // compteur « + 16 termes techniques »
      tl.fromTo("#chip", { opacity: 0, y: 40, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(2)" }, C.techniques - 0.17);
      var counter = { v: 0 };
      tl.fromTo(counter, { v: 0 }, {
        v: 16, duration: 0.93, ease: "expo.out",
        onUpdate: function () { document.getElementById("count").textContent = Math.round(counter.v); },
      }, C.techniques - L);
      tl.fromTo("#chip", { scale: 1 }, ext({ scale: 1.1, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, NO), C.absolument - L);
      burst("#burstAbs", C.absolument - L);
      mascotTimeline("m1", M1);
      punch("#cam1", C["5"] - L + 0.03, 0.04);
      punch("#cam1", C.surtout - L, 0.04);
      punch("#cam1", C.techniques - L, 0.04);
      punch("#cam1", C.absolument - L, 0.04);

      /* ═══ 1 · température ═══ */
      var N = C.un - L;
      tl.fromTo("#progress", { opacity: 0 }, { opacity: 1, duration: 0.4 }, T);
      tl.fromTo("#pfill", { scaleX: 0 }, { scaleX: 0.64, duration: 15 - T, ease: "none" }, T);
      // gros « 1 » qui s'écrase puis file dans le coin du titre
      tl.fromTo("#num1", { opacity: 0, scale: 0.4, rotation: -40 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.6)" }, N);
      burst("#burst1", N + 0.07);
      tl.fromTo("#num1", { x: 0, y: 0, scale: 1 }, ext({ x: 136 - 540, y: 313 - 748, scale: 0.4, duration: 0.47, ease: "expo.out" }, NO), N + 0.53);
      tl.fromTo("#stage", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.4)" }, N + 0.6);
      var TT = Math.max(C.temperature, C.un + 0.73) - L;
      tl.fromTo(laLetters, { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)", stagger: 0.04 }, TT);
      tl.fromTo(tLetters, { opacity: 0, y: 40, rotation: 8 }, { opacity: 1, y: 0, rotation: 0, duration: 0.45, ease: "back.out(2.2)", stagger: 0.028 }, TT + 0.13);
      tl.fromTo("#brush2", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, TT + 0.45);
      tl.fromTo("#def", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, C.evalue - L);
      // thermomètre + valeur
      function tempColor(v) {
        var stops = [[35, [197, 216, 244]], [36.7, [78, 122, 199]], [39.2, [234, 167, 193]]];
        if (v <= stops[0][0]) return "rgb(" + stops[0][1] + ")";
        for (var i = 1; i < stops.length; i++) {
          if (v <= stops[i][0]) {
            var p = (v - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0]);
            return "rgb(" + stops[i][1].map(function (c, j) { return Math.round(stops[i - 1][1][j] + (c - stops[i - 1][1][j]) * p); }).join(",") + ")";
          }
        }
        return "rgb(" + stops[2][1] + ")";
      }
      var temp = { v: 35.4 };
      function drawTemp() {
        var y = 400 - ((temp.v - 34) / 7) * 366;
        var col = document.getElementById("col");
        col.setAttribute("y", y.toFixed(1));
        col.setAttribute("height", (448 - y).toFixed(1));
        col.setAttribute("fill", tempColor(temp.v));
        document.getElementById("bulb").setAttribute("fill", tempColor(temp.v));
        document.getElementById("tval").textContent = temp.v.toFixed(1).replace(".", ",");
      }
      drawTemp();
      tl.fromTo(temp, { v: 35.4 }, { v: 36.7, duration: 0.87, ease: "power2.inOut", onUpdate: drawTemp }, N + 0.67);
      tl.fromTo(temp, { v: 36.7 }, ext({ v: 39.2, duration: 0.67, ease: "power2.inOut", onUpdate: drawTemp }, NO), C.fievre - 0.17);
      tl.fromTo("#tread", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(2)" }, N + 0.8);
      tl.fromTo("#tval", { scale: 1 }, ext({ scale: 1.08, duration: 0.15, yoyo: true, repeat: 1, transformOrigin: "left center" }, NO), C.fievre + 0.5);
      // fièvre : liquide rose qui monte + ondes de chaleur + pastille
      tl.fromTo("#wave", { y: 600 }, { y: -40, duration: 0.6, ease: "power2.out" }, C.fievre - 0.03);
      tl.fromTo("#wave", { x: 0 }, { x: -440, duration: 15 - C.fievre, ease: "none" }, C.fievre - 0.03);
      tl.fromTo("#heat", { opacity: 0 }, { opacity: 0.9, duration: 0.33 }, C.fievre + 0.03);
      tl.fromTo("#heat polyline", { strokeDashoffset: 0 }, { strokeDashoffset: -540, duration: 15 - C.fievre, ease: "none" }, C.fievre);
      tl.fromTo("#pill", { opacity: 0, scale: 0.5, rotation: -8 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2.5)" }, C.fievre - L);
      // « Fébrile » : claque au centre, s'écrit lettre à lettre, puis file à sa place dans la fiche
      var F = C.febrile - L;
      burst("#burstT", F + 0.03);
      tl.fromTo("#term", { opacity: 0, scale: 0.35, rotation: -12 }, { opacity: 1, scale: 1, rotation: -2, duration: 0.45, ease: "back.out(2.2)" }, F);
      tl.fromTo("#tsign", { scale: 0.4 }, { scale: 1, duration: 0.45, ease: "elastic.out(1, 0.45)" }, F + 0.1);
      tl.fromTo(termLetters, { opacity: 0, y: 34, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(2.4)", stagger: 0.027 }, F + 0.07);
      tl.fromTo("#tmean", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, F + 0.27);
      tl.fromTo("#term", { x: 0, y: 0, scale: 1, rotation: -2 }, ext({ x: 372 - 540, y: 1098.35 - 748, scale: 600 / 860, rotation: 0, duration: 0.47, ease: "expo.out" }, NO), F + 0.8);
      tl.fromTo("#stage", { scale: 1 }, ext({ scale: 1.02, duration: 0.1, yoyo: true, repeat: 3, ease: "sine.inOut" }, NO), F + 0.87);
      mascotTimeline("m2", M2);
      punch("#cam2", N + 0.07);
      punch("#cam2", C.fievre + 0.1);
      punch("#cam2", F + 0.03);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
